<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>流入元プローブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: スクショ用に主要7項目を1枚のカードへ圧縮し、iPhoneの1画面に収める。詳細は折り返し以降 */
:root {
  --bg: #f5f7f8;
  --surface: #ffffff;
  --fg: #16202a;
  --muted: #5b6b78;
  --line: #e1e7eb;
  --accent: #0b6e86;
  --ok: #1c7c46;
  --warn: #a35d00;
  --bad: #b3261e;
  --chip-bg: #e7eef2;
  --code-bg: #eef3f6;
  --f-display: "Space Grotesk", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --f-body: "Hiragino Sans", "Noto Sans JP", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161b; --surface: #162028; --fg: #e3eaef; --muted: #93a4b1; --line: #26343f;
    --accent: #4fb8d1; --ok: #5cc98b; --warn: #e5a54a; --bad: #f2867d;
    --chip-bg: #1f2c36; --code-bg: #1b2730; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161b; --surface: #162028; --fg: #e3eaef; --muted: #93a4b1; --line: #26343f;
  --accent: #4fb8d1; --ok: #5cc98b; --warn: #e5a54a; --bad: #f2867d;
  --chip-bg: #1f2c36; --code-bg: #1b2730; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px 40px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.titleblock { min-width: 0; display: flex; flex-direction: column; }
.headtools { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.headtools button { padding: 8px 12px; }
h1 { font-family: var(--f-display); font-size: 1.05rem; margin: 0; }
.stamp { font-family: var(--f-mono); font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; background: var(--chip-bg); display: inline-flex; gap: 4px; align-items: center; }
.chip b { font-weight: 600; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.chip.ok .dot { background: var(--ok); } .chip.warn .dot { background: var(--warn); } .chip.bad .dot { background: var(--bad); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
dl { margin: 0; }
.row { display: grid; grid-template-columns: 4.6rem 1fr; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row dt { color: var(--accent); font-family: var(--f-display); font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding-top: 1px; }
.row dd { margin: 0; min-width: 0; font-family: var(--f-mono); font-size: 0.72rem; line-height: 1.4; word-break: break-all; overflow-wrap: anywhere; }
.row dd .note { display: block; font-family: var(--f-body); color: var(--muted); font-size: 0.66rem; word-break: normal; }
.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; cursor: pointer; }
.clamp.open { -webkit-line-clamp: unset; display: block; }
.empty { color: var(--muted); font-style: italic; }
.num { font-family: var(--f-display); font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kv { display: inline-block; margin-right: 8px; }
.kv i { font-style: normal; color: var(--muted); }
h2 { font-family: var(--f-display); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 18px 0 0; }
button, input[type="url"] { font: inherit; font-size: 0.8rem; }
button { border: 1px solid var(--accent); background: transparent; color: var(--accent); padding: 5px 10px; border-radius: 6px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--surface); }
button:focus-visible, input:focus-visible, .clamp:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.urlform { display: flex; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.urlform input { flex: 1 1 220px; min-width: 0; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--code-bg); color: var(--fg); font-family: var(--f-mono); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.72rem; }
th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
th { color: var(--muted); font-weight: 500; }
td.mono { font-family: var(--f-mono); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 10px; }
.toast { font-size: 0.75rem; color: var(--ok); align-self: center; }
textarea#copyFallback { width: 100%; min-height: 120px; font-family: var(--f-mono); font-size: 0.72rem; background: var(--code-bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titleblock">
      <h1>流入元プローブ</h1>
      <span class="stamp" id="stamp"></span>
    </div>
    <div class="headtools">
      <span class="toast" id="toast" aria-live="polite"></span>
      <button type="button" class="primary" id="copyBtn">JSONをコピー</button>
    </div>
  </header>
  <div class="chips" id="chips"></div>
  <textarea id="copyFallback" hidden readonly aria-label="コピー用テキスト"></textarea>

  <div class="card">
    <dl>
      <div class="row"><dt>referer</dt><dd id="v-referrer"></dd></div>
      <div class="row"><dt>href</dt><dd id="v-href"></dd></div>
      <div class="row"><dt>遷移</dt><dd id="v-navtype"></dd></div>
      <div class="row"><dt>UTM</dt><dd id="v-utm"></dd></div>
      <div class="row"><dt>UA</dt><dd id="v-ua"></dd></div>
      <div class="row"><dt>判定</dt><dd id="v-inapp"></dd></div>
      <div class="row"><dt>Cookie</dt><dd id="v-cookie"></dd></div>
    </dl>
  </div>

  <h2>詳細</h2>
  <div class="card">
    <dl>
      <div class="row"><dt>history</dt><dd id="v-history"></dd></div>
      <div class="row"><dt>フレーム</dt><dd id="v-frame"></dd></div>
      <div class="row"><dt>OS</dt><dd id="v-os"></dd></div>
      <div class="row"><dt>初回</dt><dd id="v-first"></dd></div>
      <div class="row"><dt>前回</dt><dd id="v-prev"></dd></div>
    </dl>
    <form class="urlform" id="urlform">
      <input type="url" id="urlInput" placeholder="URLを貼ってUTMを解析" aria-label="UTMを解析するURL">
      <button type="submit">解析</button>
    </form>
    <dl id="utmManual"></dl>
  </div>

  <h2>訪問履歴</h2>
  <div class="card">
    <div class="tablewrap">
      <table>
        <thead><tr><th>#</th><th>日時</th><th>遷移</th><th>判定</th><th>referer</th></tr></thead>
        <tbody id="log"></tbody>
      </table>
    </div>
    <div class="tools">
      <button type="button" id="resetBtn">カウントと履歴をリセット</button>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = "probe_visits";
  var LOGKEY = "probe_log";

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function setVal(id, value, note, clamp) {
    var body = (value === "" || value == null) ? '<span class="empty">(空)</span>' : esc(value);
    if (clamp && value) body = '<span class="clamp" tabindex="0" title="タップで全文表示">' + body + '</span>';
    if (note) body += '<span class="note">' + esc(note) + '</span>';
    $(id).innerHTML = body;
  }
  document.addEventListener("click", function (e) {
    var c = e.target.closest && e.target.closest(".clamp");
    if (c) c.classList.toggle("open");
  });

  var now = new Date();
  function fmt(iso) { var d = new Date(iso); return d.toLocaleString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
  $("stamp").textContent = fmt(now.toISOString());

  // ---- 遷移 ----
  var ref = document.referrer;
  var inFrame = false;
  try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
  var ancestors = [];
  try { if (location.ancestorOrigins) for (var i = 0; i < location.ancestorOrigins.length; i++) ancestors.push(location.ancestorOrigins[i]); } catch (e) {}

  var navType = "unknown";
  try {
    var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
    if (nav && nav.type) navType = nav.type;
    else if (performance.navigation) navType = ["navigate", "reload", "back_forward"][performance.navigation.type] || "reserved";
  } catch (e) {}
  var navNote = { navigate: "通常の遷移（リンク・外部アプリからの起動など）", reload: "再読み込み", back_forward: "戻る/進む（bfcache 復元を含む）", prerender: "先読みでの表示" }[navType] || "";

  setVal("v-referrer", ref, "", true);
  setVal("v-href", location.href, "", true);
  setVal("v-navtype", navType, navNote);
  setVal("v-history", String(history.length), "1 なら新規タブ/ウィンドウとして開かれた可能性が高い");
  setVal("v-frame", inFrame ? "iframe 内" : "トップレベル", inFrame ? ("親: " + (ancestors.join(" › ") || "取得不可")) : "");

  // ---- UTM ----
  var UTM_KEYS = ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content", "utm_id"];
  var CLICK_IDS = ["gclid", "fbclid", "yclid", "ldtag_cl", "ttclid", "twclid"];
  function parseUtm(urlStr) {
    var out = {};
    try {
      var u = new URL(urlStr);
      UTM_KEYS.concat(CLICK_IDS).forEach(function (k) { if (u.searchParams.has(k)) out[k] = u.searchParams.get(k); });
    } catch (e) { return null; }
    return out;
  }
  function utmInline(obj) {
    var keys = Object.keys(obj || {});
    if (!keys.length) return '<span class="empty">なし</span>';
    return keys.map(function (k) { return '<span class="kv"><i>' + esc(k.replace(/^utm_/, "")) + "=</i>" + esc(obj[k]) + "</span>"; }).join("");
  }
  var utmHere = parseUtm(location.href) || {};
  $("v-utm").innerHTML = utmInline(utmHere);
  $("urlform").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("urlInput").value.trim();
    if (!v) return;
    var r = parseUtm(v);
    $("utmManual").innerHTML = '<div class="row"><dt>結果</dt><dd>' + (r ? utmInline(r) : '<span class="empty">URLとして解釈できません</span>') + "</dd></div>";
  });

  // ---- UA ----
  var ua = navigator.userAgent;
  var RULES = [
    [/Line\//i, "LINE"], [/Instagram/i, "Instagram"], [/FBAN|FBAV|FB_IAB/i, "Facebook"],
    [/musical_ly|BytedanceWebview|TikTok/i, "TikTok"], [/Twitter/i, "X (Twitter)"],
    [/YJApp-IOS|YJApp/i, "Yahoo! JAPAN"], [/GSA\//i, "Google アプリ"], [/KAKAOTALK/i, "KakaoTalk"],
    [/Snapchat/i, "Snapchat"], [/Pinterest/i, "Pinterest"],
    [/CriOS/i, "Chrome (iOS)"], [/FxiOS/i, "Firefox (iOS)"], [/EdgiOS/i, "Edge (iOS)"]
  ];
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var hit = null;
  for (var r = 0; r < RULES.length; r++) if (RULES[r][0].test(ua)) { hit = RULES[r][1]; break; }
  var inAppLabel, inAppNote = "", inAppState;
  if (hit && /Chrome \(iOS\)|Firefox|Edge/.test(hit)) { inAppLabel = hit; inAppState = "ok"; inAppNote = "通常のブラウザアプリ"; }
  else if (hit) { inAppLabel = hit + " のアプリ内ブラウザ"; inAppState = "warn"; }
  else if (isIOS && !/Safari\//.test(ua)) { inAppLabel = "WKWebView（アプリ不明）"; inAppState = "warn"; inAppNote = "UA に Safari/ が無いため WebView と推定"; }
  else if (isIOS) { inAppLabel = "Safari / SFSafariViewController"; inAppState = "ok"; inAppNote = "この2つは UA では区別できません"; }
  else { inAppLabel = "iOS 以外"; inAppState = ""; }
  setVal("v-ua", ua);
  setVal("v-inapp", inAppLabel, inAppNote);
  var osm = ua.match(/OS (\d+[_\d]*) like Mac OS X/);
  setVal("v-os", (isIOS ? "iOS " + (osm ? osm[1].replace(/_/g, ".") : "?") : (navigator.platform || "?")) + " / " + (ua.match(/iPhone|iPad|iPod/) || ["?"])[0]);

  // ---- Cookie / localStorage ----
  function readCookie(name) {
    try { var m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)")); return m ? decodeURIComponent(m[1]) : null; }
    catch (e) { return null; }
  }
  function writeCookie(name, value) {
    try {
      var secure = location.protocol === "https:" ? "; Secure; SameSite=None" : "; SameSite=Lax";
      document.cookie = name + "=" + encodeURIComponent(value) + "; Max-Age=31536000; Path=/" + secure;
    } catch (e) {}
  }
  var cookieCount = (parseInt(readCookie(KEY), 10) || 0) + 1;
  writeCookie(KEY, String(cookieCount));
  var cookieOk = readCookie(KEY) === String(cookieCount);

  var lsOk = true, lsCount = null, log = [];
  try {
    lsCount = (parseInt(localStorage.getItem(KEY), 10) || 0) + 1;
    localStorage.setItem(KEY, String(lsCount));
    log = JSON.parse(localStorage.getItem(LOGKEY) || "[]");
  } catch (e) { lsOk = false; }

  var entry = { t: now.toISOString(), nav: navType, inapp: inAppLabel, ref: ref, href: location.href };
  var prev = log.length ? log[log.length - 1] : null;
  var first = log.length ? log[0] : entry;
  log.push(entry);
  if (log.length > 30) log = log.slice(-30);
  try { localStorage.setItem(LOGKEY, JSON.stringify(log)); } catch (e) {}

  var cookieHtml = cookieOk
    ? '<span class="num">' + cookieCount + '</span> 回目' + (cookieCount === 1 ? "（新規発行）" : "（継続）")
    : '<span class="empty">ブロック（書き込み不可）</span>';
  cookieHtml += '<span class="note">localStorage: ' + (lsOk ? lsCount + " 回目" : "使用不可") + "</span>";
  $("v-cookie").innerHTML = cookieHtml;
  setVal("v-first", fmt(first.t));
  setVal("v-prev", prev ? fmt(prev.t) + "（" + prev.nav + " / " + prev.inapp + "）" : "", prev ? "" : "履歴なし");

  $("log").innerHTML = log.slice().reverse().map(function (l, i) {
    return "<tr><td>" + (log.length - i) + "</td><td>" + esc(fmt(l.t)) + "</td><td>" + esc(l.nav) + "</td><td>" + esc(l.inapp) + '</td><td class="mono">' + esc(l.ref || "(空)") + "</td></tr>";
  }).join("");

  // ---- チップ ----
  var refHost = "空";
  try { if (ref) refHost = new URL(ref).host; } catch (e) { refHost = "不正"; }
  var utmN = Object.keys(utmHere).length;
  var chips = [
    [inAppState, "", hit && inAppState === "warn" ? hit + " 内" : inAppLabel],
    ["", "nav", navType],
    [ref ? "ok" : "warn", "ref", refHost],
    [utmN ? "ok" : "", "UTM", utmN ? utmN + "件" : "なし"],
    [cookieOk ? (cookieCount > 1 ? "ok" : "") : "bad", "Cookie", cookieOk ? cookieCount + "回目" : "ブロック"]
  ];
  if (inFrame) chips.push(["warn", "", "iframe 内"]);
  $("chips").innerHTML = chips.map(function (c) {
    return '<span class="chip ' + c[0] + '"><span class="dot"></span>' + (c[1] ? esc(c[1]) + " " : "") + "<b>" + esc(c[2]) + "</b></span>";
  }).join("");

  // ---- コピー / リセット ----
  function report() {
    return JSON.stringify({
      capturedAt: now.toISOString(), referrer: ref, href: location.href, navigationType: navType,
      historyLength: history.length, inFrame: inFrame, ancestorOrigins: ancestors,
      userAgent: ua, inAppBrowser: inAppLabel, utm: utmHere,
      cookie: { writable: cookieOk, count: cookieOk ? cookieCount : null },
      localStorage: { available: lsOk, count: lsCount }, log: log
    }, null, 2);
  }
  function toast(msg) { $("toast").textContent = msg; setTimeout(function () { $("toast").textContent = ""; }, 2500); }
  $("copyBtn").addEventListener("click", function () {
    var text = report();
    var fallback = function () { var ta = $("copyFallback"); ta.value = text; ta.hidden = false; ta.focus(); ta.select(); toast("手動でコピー"); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast("コピーしました"); }, fallback);
    else fallback();
  });
  var armed = false;
  $("resetBtn").addEventListener("click", function () {
    var b = this;
    if (!armed) { armed = true; b.textContent = "もう一度押すとリセット"; setTimeout(function () { armed = false; b.textContent = "カウントと履歴をリセット"; }, 3000); return; }
    try { document.cookie = KEY + "=; Max-Age=0; Path=/"; } catch (e) {}
    try { localStorage.removeItem(KEY); localStorage.removeItem(LOGKEY); } catch (e) {}
    location.reload();
  });
})();
</script>
</body>
</html>
